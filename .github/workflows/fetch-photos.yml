name: Fetch listing photos
on:
  push:
    paths: ['queue/photos.txt']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: repo-writes
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Download queued photos
        run: |
          set -euo pipefail
          mkdir -p photos
          declare -A n
          while read -r id url; do
            [[ -z "${id:-}" || "$id" == \#* ]] && continue
            [[ "$id" =~ ^[0-9]+$ ]] || { echo "::warning::skipped bad listing id: $id"; continue; }
            n[$id]=$(( ${n[$id]:-0} + 1 ))
            out="photos/${id}-${n[$id]}.jpg"
            [[ "${url:-}" =~ ^https://i\.etsystatic\.com/[A-Za-z0-9/._-]+$ ]] || { echo "::warning::skipped non-Etsy url for $out: ${url:-<none>}"; continue; }
            if ! curl -fsSL --max-time 60 --max-filesize 20000000 -o "$out.tmp" "$url"; then
              echo "::warning::download failed for $out: $url"; rm -f "$out.tmp"; continue
            fi
            if file "$out.tmp" | grep -qiE 'jpeg|png|webp'; then mv "$out.tmp" "$out"; else echo "::warning::not an image, skipped $out: $url"; rm -f "$out.tmp"; fi
          done < queue/photos.txt
      - name: Commit
        run: |
          git config user.name "hexhollow-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add photos
          git diff --cached --quiet || git commit -m "Fetch listing photos"
          git pull --rebase && git push
